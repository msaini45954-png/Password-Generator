
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Password Generator</title>

    {% load static %}

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <script src="{% static 'js/scripts.js' %}" defer></script>
</head>

<body>

    <header>
        <h1>Password Generator</h1>
    </header>

    <main>
        <div id="data">

            <form method="POST">
                {% csrf_token %}

                <h2 id="strength">
                    {{ strength|default:"Strength of Password" }}
                </h2>

                <input
                    type="text"
                    placeholder="Your Password..."
                    readonly
                    id="pass"
                    value="{{ new_password|default:'' }}"
                >

                <button type="button" id="copy_password" name="copy_password">
                    Copy Password
                </button>

                <button type="submit" id="generate" name="generate_btn">
                    Generate
                </button>

                <h2>Select Range of Characters</h2>

                <input
                    type="range"
                    min="1"
                    max="50"
                    value="8"
                    id="myRange"
                    name="myRange"
                >

                <p>Value: <span id="output">8</span></p>

                <div class="checkbox-group">

                    <label>
                        <input type="checkbox" name="option" id="uppercase"
                            value="uppercase" checked>
                        Uppercase
                    </label>

                    <label>
                        <input type="checkbox" name="option" id="lowercase"
                            value="lowercase" checked>
                        Lowercase
                    </label>

                    <label>
                        <input type="checkbox" name="option" id="numbers"
                            value="numbers" checked>
                        Numbers
                    </label>

                    <label>
                        <input type="checkbox" name="option" id="symbols"
                            value="symbols" checked>
                        Symbols
                    </label>

                </div>

            </form>

        </div>
    </main>

    <footer>
        &copy; 2026 Password Generator. All rights reserved.
    </footer>

</body>
</html>
